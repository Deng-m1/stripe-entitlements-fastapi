name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  # Moving ``latest`` and ``major.minor`` tags are repository-global state. Serialize
  # every release so an older workflow that evaluated policy before a newer tag existed
  # cannot finish last and roll a channel tag backward.
  group: release
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build and verify release candidates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    outputs:
      build_attempt: ${{ steps.transfer.outputs.run_attempt }}
      container_artifact: ${{ steps.transfer.outputs.container_artifact }}
      container_image: ${{ steps.image.outputs.name }}
      container_manifest_sha256: ${{ steps.transfer.outputs.container_manifest_sha256 }}
      npm_integrity: ${{ steps.npm_artifact.outputs.integrity }}
      package_artifact: ${{ steps.transfer.outputs.package_artifact }}
      package_exists: ${{ steps.npm_registry.outputs.package_exists }}
      package_manifest_sha256: ${{ steps.transfer.outputs.package_manifest_sha256 }}
      publish_tag: ${{ steps.npm_registry.outputs.publish_tag }}
      release_artifact: ${{ steps.transfer.outputs.release_artifact }}
      release_manifest_sha256: ${{ steps.transfer.outputs.release_manifest_sha256 }}
      release_version: ${{ steps.tag_guard.outputs.version }}
      tag_commit: ${{ steps.tag_guard.outputs.tag_commit }}
      tag_object: ${{ steps.tag_guard.outputs.tag_object }}
      version_exists: ${{ steps.npm_registry.outputs.version_exists }}
    steps:
      - name: Check out the immutable public tag without a token
        env:
          EXPECTED_REPOSITORY: ToseaAI/stripe-entitlements
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          git init .
          git remote add origin "https://github.com/${EXPECTED_REPOSITORY}.git"
          git fetch --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false

      - name: Verify immutable tag and coordinated versions
        id: tag_guard
        env:
          ACTUAL_REPOSITORY_ID: ${{ github.repository_id }}
          ACTUAL_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          EXPECTED_REPOSITORY: ToseaAI/stripe-entitlements
          EXPECTED_REPOSITORY_ID: "1346854294"
          EXPECTED_REPOSITORY_OWNER_ID: "251731194"
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$ACTUAL_REPOSITORY_ID" = "$EXPECTED_REPOSITORY_ID"
          test "$ACTUAL_REPOSITORY_OWNER_ID" = "$EXPECTED_REPOSITORY_OWNER_ID"
          git fetch --no-tags origin main
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag"
          tag_object="$(git rev-parse "refs/tags/$GITHUB_REF_NAME")"
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$tag_commit" origin/main
          remote_tag_object="$(git ls-remote --refs origin \
            "refs/tags/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')"
          test -n "$remote_tag_object"
          test "$remote_tag_object" = "$tag_object"
          tag_version="${GITHUB_REF_NAME#v}"
          python scripts/check_release_versions.py "$tag_version"
          {
            echo "tag_object=$tag_object"
            echo "tag_commit=$tag_commit"
            echo "version=$tag_version"
          } >> "$GITHUB_OUTPUT"

      - name: Verify backend
        run: |
          uv sync --frozen
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src
          uv run pytest -m "not real_stripe"
          uv audit

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Pin and authenticate the npm CLI release archive
        shell: bash
        run: |
          set -euo pipefail
          npm_cli_archive="$RUNNER_TEMP/npm-11.19.1.tgz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://registry.npmjs.org/npm/-/npm-11.19.1.tgz \
            --output "$npm_cli_archive"
          observed_integrity="sha512-$(openssl dgst -sha512 -binary \
            "$npm_cli_archive" | openssl base64 -A)"
          expected_integrity="sha512-ztsxKxt/kkIaAs+2i0GU6I+DRmUdrNasxTZKJe9TCdSjKxlhah/4r/hl5ygMD6XAg1qZ9c2TNomR4qgOydp10g=="
          test "$observed_integrity" = "$expected_integrity"
          npm install --global "$npm_cli_archive" \
            --ignore-scripts --no-audit --no-fund
          hash -r
          test "$(npm --version)" = "11.19.1"

      - name: Verify TypeScript billing core
        working-directory: typescript
        run: |
          npm ci
          npm audit --omit=dev
          npm audit
          npm audit --prefix ../tests/npm-next-consumer --package-lock-only --omit=dev
          npm audit --prefix ../tests/npm-next-consumer --package-lock-only
          npm run check

      - name: Verify reference web application
        working-directory: web
        env:
          NEXT_PUBLIC_ALLOW_INDEXING: "true"
          NEXT_PUBLIC_SITE_URL: https://billing.example.test
        run: |
          npm ci
          npm audit --omit=dev
          npm audit
          npm run lint
          npm run typecheck
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e:simulation
          npm run build

      - name: Build Python distributions
        env:
          RELEASE_VERSION: ${{ steps.tag_guard.outputs.version }}
        run: |
          scripts/build_distributions.sh dist
          python scripts/verify_python_distributions.py dist
          python - <<'PY'
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          expected = os.environ["RELEASE_VERSION"]
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with tempfile.TemporaryDirectory(prefix="stripe-release-wheel-") as temporary:
              venv = Path(temporary) / "venv"
              subprocess.run(["uv", "venv", str(venv)], check=True)
              subprocess.run(
                  ["uv", "pip", "install", "--python", str(venv / "bin/python"), str(wheels[0])],
                  check=True,
              )
              completed = subprocess.run(
                  [str(venv / "bin/stripe-entitlements"), "--version"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
          assert completed.stderr == "", completed.stderr
          assert completed.stdout.strip() == f"stripe-entitlements {expected}"
          PY

      - name: Build, install, and migrate with the npm distribution
        id: npm_artifact
        working-directory: typescript
        env:
          RELEASE_VERSION: ${{ steps.tag_guard.outputs.version }}
        run: |
          set -euo pipefail
          archive_name="$(npm pack --pack-destination ../dist --silent)"
          test "$archive_name" = \
            "tosea-stripe-entitlements-${RELEASE_VERSION}.tgz"
          archive="$GITHUB_WORKSPACE/dist/$archive_name"
          test -s "$archive"
          archive_integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | \
            openssl base64 -A)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "integrity=$archive_integrity" >> "$GITHUB_OUTPUT"
          package_root="$(mktemp -d)"
          npm install --prefix "$package_root" "$archive"
          installed="$package_root/node_modules/@tosea/stripe-entitlements"
          test -x "$package_root/node_modules/.bin/stripe-entitlements"
          test -f "$installed/.env.example"
          test "$(node -p "require('$installed/package.json').version")" = "$RELEASE_VERSION"
          cmp ../LICENSE "$installed/LICENSE"
          cmp ../NOTICE "$installed/NOTICE"
          cmp ../plans.toml "$installed/dist/plans.toml"
          packaged_migrations="$(find "$installed/dist/migrations" -maxdepth 1 \
            -type f -name '*.sql' -printf '%f\n' | sort)"
          test "$packaged_migrations" = \
            $'001_v3_baseline.sql\n002_stripe_request_snapshots.sql'
          cmp ../migrations/001_v3_baseline.sql \
            "$installed/dist/migrations/001_v3_baseline.sql"
          cmp ../migrations/002_stripe_request_snapshots.sql \
            "$installed/dist/migrations/002_stripe_request_snapshots.sql"
          test "$("$package_root/node_modules/.bin/stripe-entitlements" --version)" = \
            "stripe-entitlements $RELEASE_VERSION"
          (
            cd "$package_root"
            node --input-type=module <<'JS'
          import {
            CREDIT_SCALE,
            CreditAmount,
            PlanCatalog,
          } from "@tosea/stripe-entitlements";
          import { createBillingFetchHandler } from "@tosea/stripe-entitlements/http";
          import {
            createNextBillingRouteHandler,
            runtime,
          } from "@tosea/stripe-entitlements/next";
          import { parseNodeBillingCommand } from "@tosea/stripe-entitlements/node";

          if (CREDIT_SCALE !== 1_000_000n) throw new Error("credit scale drift");
          if (CreditAmount.parse("0.125").atoms !== 125_000n) {
            throw new Error("fractional credit import failed");
          }
          if (typeof PlanCatalog.fromToml !== "function") {
            throw new Error("catalog package export is unavailable");
          }
          if (typeof createBillingFetchHandler !== "function") {
            throw new Error("HTTP package export is unavailable");
          }
          if (typeof createNextBillingRouteHandler !== "function" || runtime !== "nodejs") {
            throw new Error("Next.js package export is unavailable");
          }
          if (typeof parseNodeBillingCommand !== "function") {
            throw new Error("Node package export is unavailable");
          }
          JS
          )
          ../scripts/verify_npm_migration_smoke.sh "$archive" "$RELEASE_VERSION"
          ../scripts/verify_npm_next_consumer.sh "$archive"

      - name: Preflight the npm registry destination
        id: npm_registry
        working-directory: typescript
        env:
          EXPECTED_INTEGRITY: ${{ steps.npm_artifact.outputs.integrity }}
          NPM_CONFIG_USERCONFIG: /dev/null
          RELEASE_VERSION: ${{ steps.tag_guard.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="@tosea/stripe-entitlements"
          package_spec="${package_name}@${RELEASE_VERSION}"
          package_exists=false
          package_error="$RUNNER_TEMP/npm-package-lookup.txt"
          if observed_name="$(npm view "$package_name" name \
            --json 2>"$package_error" | tr -d '"\r\n')"; then
            test "$observed_name" = "$package_name"
            package_exists=true
          elif ! grep -Eq '(^|[[:space:]])E404([[:space:]]|$)|404 Not Found' \
            "$package_error"; then
            echo "could not determine whether the npm package exists" >&2
            sed -n '1,12p' "$package_error" >&2
            exit 1
          fi

          version_exists=false
          error_file="$RUNNER_TEMP/npm-version-lookup.txt"
          if existing_integrity="$(npm view "$package_spec" dist.integrity \
            --json 2>"$error_file" | tr -d '"\r\n')"; then
            test -n "$existing_integrity"
            if [ "$existing_integrity" != "$EXPECTED_INTEGRITY" ]; then
              echo "refusing existing npm version with different tarball integrity" >&2
              exit 1
            fi
            version_exists=true
            echo "$package_spec already contains the exact verified artifact"
          else
            if ! grep -Eq '(^|[[:space:]])E404([[:space:]]|$)|404 Not Found' \
              "$error_file"; then
              echo "could not prove that $package_spec is vacant" >&2
              sed -n '1,12p' "$error_file" >&2
              exit 1
            fi
            echo "$package_spec is vacant"
          fi

          if [ "$version_exists" = "true" ] && [ "$package_exists" != "true" ]; then
            echo "npm registry returned an inconsistent package/version view" >&2
            exit 1
          fi

          publish_tag="release-${RELEASE_VERSION//[^0-9A-Za-z]/-}"
          {
            echo "package_exists=$package_exists"
            echo "version_exists=$version_exists"
            echo "publish_tag=$publish_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Generate distribution checksums
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          distributions=(*.whl *.tar.gz *.tgz)
          test "${#distributions[@]}" -eq 3
          sha256sum "${distributions[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build the exact OCI release candidate
        id: container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          provenance: false
          push: false
          sbom: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.tag_guard.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ steps.tag_guard.outputs.tag_commit }}
            org.opencontainers.image.source=https://github.com/ToseaAI/stripe-entitlements
            org.opencontainers.image.version=${{ steps.tag_guard.outputs.version }}

      - name: Verify migrations and hardened runtime on the release image
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.name }}
          RELEASE_VERSION: ${{ steps.tag_guard.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${CONTAINER_IMAGE}:${GITHUB_REF_NAME#v}"
          test "$(docker image inspect "$release_tag" --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect "$release_tag" --format '{{json .Config.Healthcheck.Test}}')" != "null"
          python - <<'PY'
          import os
          import subprocess

          expected = os.environ["RELEASE_VERSION"]
          image = f"{os.environ['CONTAINER_IMAGE']}:{expected}"
          completed = subprocess.run(
              ["docker", "run", "--rm", image, "stripe-entitlements", "--version"],
              check=True,
              capture_output=True,
              text=True,
          )
          assert completed.stderr == "", completed.stderr
          assert completed.stdout.strip() == f"stripe-entitlements {expected}"
          PY

          runtime_suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          runtime_network="stripe-release-${runtime_suffix}"
          runtime_pg="stripe-release-pg-${runtime_suffix}"
          runtime_app="stripe-release-app-${runtime_suffix}"
          cleanup_runtime() {
            docker rm -f "$runtime_app" "$runtime_pg" >/dev/null 2>&1 || true
            docker network rm "$runtime_network" >/dev/null 2>&1 || true
          }
          trap cleanup_runtime EXIT
          cleanup_runtime
          docker network create --internal "$runtime_network"
          docker run -d \
            --name "$runtime_pg" \
            --network "$runtime_network" \
            --tmpfs /var/lib/postgresql/data:rw,nosuid,nodev,size=256m \
            -e POSTGRES_PASSWORD=release-ci-only \
            -e POSTGRES_DB=release_ci \
            postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          for attempt in $(seq 1 60); do
            if docker exec "$runtime_pg" pg_isready -U postgres -d release_ci >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$runtime_pg"
              exit 1
            fi
            sleep 1
          done

          runtime_database_url="postgresql://postgres:release-ci-only@${runtime_pg}:5432/release_ci"
          docker run --rm \
            --network "$runtime_network" \
            --user 10001:10001 \
            -e DATABASE_URL="$runtime_database_url" \
            "$release_tag" stripe-entitlements migrate
          applied_migrations="$(docker exec "$runtime_pg" \
            psql -U postgres -d release_ci -Atqc \
            "select string_agg(filename, ',' order by filename) from schema_migrations")"
          test "$applied_migrations" = \
            "001_v3_baseline.sql,002_stripe_request_snapshots.sql"
          canonical_migration_history="$(sha256sum \
            migrations/001_v3_baseline.sql \
            migrations/002_stripe_request_snapshots.sql | \
            awk '{sub("^migrations/", "", $2); print $2 "|" $1}')"
          applied_migration_history="$(docker exec "$runtime_pg" \
            psql -U postgres -d release_ci -Atqc \
            "select filename||'|'||sha256 from schema_migrations order by filename")"
          test "$applied_migration_history" = "$canonical_migration_history"
          schema_contract="$(docker exec "$runtime_pg" psql -U postgres -d release_ci -Atqc \
            "select to_regclass('credit_pack_orders') is not null,
                    to_regclass('credit_funding_lots') is not null,
                    to_regclass('credit_debit_allocations') is not null,
                    to_regclass('credit_pack_clawback_debts') is not null,
                    exists(select 1 from information_schema.columns
                            where table_schema='public'
                              and table_name='credit_pack_orders'
                              and column_name='request_customer_id'
                              and data_type='text' and is_nullable='YES'),
                    (select count(*)=6 from information_schema.columns
                      where table_schema='public'
                        and table_name in (
                          'checkout_claims','credit_pack_orders','billing_plan_changes'
                        )
                        and column_name in (
                          'request_snapshot_version','stripe_request_snapshot'
                        ))")"
          test "$schema_contract" = "t|t|t|t|t|t"

          docker run -d \
            --name "$runtime_app" \
            --network "$runtime_network" \
            --user 10001:10001 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e DATABASE_URL="$runtime_database_url" \
            -e STRIPE_SECRET_KEY=sk_test_release_placeholder \
            -e STRIPE_WEBHOOK_SECRET=whsec_release_placeholder \
            -e STRIPE_WEBHOOK_API_VERSION=2026-06-24.dahlia \
            "$release_tag"
          runtime_ip="$(docker inspect "$runtime_app" \
            --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')"
          test -n "$runtime_ip"
          health_json=""
          for attempt in $(seq 1 60); do
            if health_json="$(curl --noproxy '*' --fail --silent --show-error \
              "http://${runtime_ip}:8000/health" 2>/dev/null)"; then
              break
            fi
            if [ "$(docker inspect "$runtime_app" --format '{{.State.Running}}')" != "true" ] \
              || [ "$attempt" -eq 60 ]; then
              docker logs "$runtime_app"
              exit 1
            fi
            sleep 1
          done
          python -c \
            'import json,sys; value=json.loads(sys.argv[1]); assert value["ok"] is True and value["database"] is True, value' \
            "$health_json"

      - name: Generate the container SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.image.outputs.name }}:${{ steps.tag_guard.outputs.version }}
          format: spdx-json
          output-file: dist/CONTAINER_SBOM.spdx.json

      - name: Stage byte-identified cross-job release artifacts
        id: transfer
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.name }}
          RELEASE_VERSION: ${{ steps.tag_guard.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e transfer
          package_dir="transfer/package"
          container_dir="transfer/container"
          release_dir="transfer/release"
          mkdir -p "$package_dir" "$container_dir" "$release_dir"

          npm_archive="dist/tosea-stripe-entitlements-${RELEASE_VERSION}.tgz"
          test -s "$npm_archive"
          cp "$npm_archive" "$package_dir/"
          cp "$RUNNER_TEMP/npm-11.19.1.tgz" "$package_dir/"
          cp typescript/scripts/generate-npm-attestation.mjs "$package_dir/"
          (
            cd "$package_dir"
            sha256sum generate-npm-attestation.mjs npm-11.19.1.tgz \
              "tosea-stripe-entitlements-${RELEASE_VERSION}.tgz" \
              > PACKAGE_MANIFEST.sha256
            sha256sum --check PACKAGE_MANIFEST.sha256
          )

          docker save "${CONTAINER_IMAGE}:${RELEASE_VERSION}" \
            --output "$container_dir/CONTAINER_IMAGE.tar"
          test -s "$container_dir/CONTAINER_IMAGE.tar"
          (
            cd "$container_dir"
            sha256sum CONTAINER_IMAGE.tar > CONTAINER_MANIFEST.sha256
            sha256sum --check CONTAINER_MANIFEST.sha256
          )

          shopt -s nullglob
          public_distributions=(dist/*.whl dist/*.tar.gz dist/*.tgz)
          test "${#public_distributions[@]}" -eq 3
          cp "${public_distributions[@]}" dist/SHA256SUMS \
            dist/CONTAINER_SBOM.spdx.json "$release_dir/"
          (
            cd "$release_dir"
            sha256sum CONTAINER_SBOM.spdx.json SHA256SUMS \
              "stripe_entitlements_fastapi-${RELEASE_VERSION}-py3-none-any.whl" \
              "stripe_entitlements_fastapi-${RELEASE_VERSION}.tar.gz" \
              "tosea-stripe-entitlements-${RELEASE_VERSION}.tgz" \
              > RELEASE_MANIFEST.sha256
            sha256sum --check RELEASE_MANIFEST.sha256
          )

          package_artifact="release-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_artifact="release-container-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_artifact="release-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "package_artifact=$package_artifact"
            echo "container_artifact=$container_artifact"
            echo "release_artifact=$release_artifact"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "package_manifest_sha256=$(sha256sum \
              "$package_dir/PACKAGE_MANIFEST.sha256" | awk '{print $1}')"
            echo "container_manifest_sha256=$(sha256sum \
              "$container_dir/CONTAINER_MANIFEST.sha256" | awk '{print $1}')"
            echo "release_manifest_sha256=$(sha256sum \
              "$release_dir/RELEASE_MANIFEST.sha256" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the npm publication candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.transfer.outputs.package_artifact }}
          path: transfer/package/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload the exact tested container archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.transfer.outputs.container_artifact }}
          path: transfer/container/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload the public Release candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.transfer.outputs.release_artifact }}
          path: transfer/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  npm-identity:
    name: Sign and publish the npm candidate with trusted identity
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      id-token: write
    outputs:
      provenance_artifact: ${{ steps.provenance_transfer.outputs.artifact }}
      provenance_manifest_sha256: ${{ steps.provenance_transfer.outputs.manifest_sha256 }}
    steps:
      - name: Download the npm publication candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.build-and-verify.outputs.package_artifact }}
          path: transfer/package

      - name: Verify the npm candidate transfer manifest
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build-and-verify.outputs.package_manifest_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="transfer/package/PACKAGE_MANIFEST.sha256"
          test "$(sha256sum "$manifest" | awk '{print $1}')" = \
            "$EXPECTED_MANIFEST_SHA256"
          (cd transfer/package && sha256sum --check PACKAGE_MANIFEST.sha256)

      - name: Revalidate the annotated publication tag
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.build-and-verify.outputs.tag_object }}
        shell: bash
        run: |
          set -euo pipefail
          remote_tag_object="$(git ls-remote --refs \
            "https://github.com/ToseaAI/stripe-entitlements.git" \
            "refs/tags/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')"
          test "$remote_tag_object" = "$EXPECTED_TAG_OBJECT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          package-manager-cache: false

      - name: Prepare the exact audited npm CLI
        id: npm_cli
        shell: bash
        run: |
          set -euo pipefail
          npm_root="$RUNNER_TEMP/audited-npm"
          mkdir "$npm_root"
          tar -xzf transfer/package/npm-11.19.1.tgz -C "$npm_root"
          mv "$npm_root/package" "$npm_root/npm"
          npm_cli="$npm_root/npm/bin/npm-cli.js"
          test "$(node "$npm_cli" --version)" = "11.19.1"
          echo "root=$npm_root" >> "$GITHUB_OUTPUT"
          echo "cli=$npm_cli" >> "$GITHUB_OUTPUT"

      - name: Generate the environment-bound npm provenance bundle
        if: >-
          needs.build-and-verify.outputs.package_exists == 'false' &&
          needs.build-and-verify.outputs.version_exists == 'false'
        id: provenance
        env:
          EXPECTED_INTEGRITY: ${{ needs.build-and-verify.outputs.npm_integrity }}
          EXPECTED_REPOSITORY: ToseaAI/stripe-entitlements
          EXPECTED_REPOSITORY_ID: "1346854294"
          EXPECTED_REPOSITORY_OWNER_ID: "251731194"
          EXPECTED_TAG_COMMIT: ${{ needs.build-and-verify.outputs.tag_commit }}
          NPM_ROOT: ${{ steps.npm_cli.outputs.root }}
          RELEASE_VERSION: ${{ needs.build-and-verify.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          provenance_file="$RUNNER_TEMP/npm-provenance.json"
          node transfer/package/generate-npm-attestation.mjs \
            --package-name "@tosea/stripe-entitlements" \
            --version "$RELEASE_VERSION" \
            --integrity "$EXPECTED_INTEGRITY" \
            --commit "$EXPECTED_TAG_COMMIT" \
            --tag "$GITHUB_REF_NAME" \
            --repository "$EXPECTED_REPOSITORY" \
            --repository-id "$EXPECTED_REPOSITORY_ID" \
            --repository-owner-id "$EXPECTED_REPOSITORY_OWNER_ID" \
            --workflow-path ".github/workflows/release.yml" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --environment "npm-publish" \
            --npm-root "$NPM_ROOT" \
            --output "$provenance_file"
          test -s "$provenance_file"
          echo "file=$provenance_file" >> "$GITHUB_OUTPUT"

      - name: Publish an existing npm package through trusted OIDC
        if: >-
          needs.build-and-verify.outputs.package_exists == 'true' &&
          needs.build-and-verify.outputs.version_exists == 'false'
        env:
          ARCHIVE: transfer/package/tosea-stripe-entitlements-${{ needs.build-and-verify.outputs.release_version }}.tgz
          EXPECTED_INTEGRITY: ${{ needs.build-and-verify.outputs.npm_integrity }}
          NPM_CLI: ${{ steps.npm_cli.outputs.cli }}
          NPM_CONFIG_USERCONFIG: /dev/null
          PUBLISH_TAG: ${{ needs.build-and-verify.outputs.publish_tag }}
          RELEASE_VERSION: ${{ needs.build-and-verify.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="@tosea/stripe-entitlements"
          package_spec="${package_name}@${RELEASE_VERSION}"
          error_file="$RUNNER_TEMP/npm-oidc-version-recheck.txt"
          if existing_integrity="$(node "$NPM_CLI" view \
            "$package_spec" dist.integrity --json 2>"$error_file" | \
            tr -d '"\r\n')"; then
            test "$existing_integrity" = "$EXPECTED_INTEGRITY"
            echo "$package_spec appeared with the exact verified artifact"
            exit 0
          fi
          if ! grep -Eq '(^|[[:space:]])E404([[:space:]]|$)|404 Not Found' \
            "$error_file"; then
            echo "could not re-confirm npm version vacancy" >&2
            sed -n '1,12p' "$error_file" >&2
            exit 1
          fi
          node "$NPM_CLI" publish "$ARCHIVE" \
            --access public \
            --tag "$PUBLISH_TAG" \
            --ignore-scripts

      - name: Stage the bootstrap provenance bundle
        if: >-
          needs.build-and-verify.outputs.package_exists == 'false' &&
          needs.build-and-verify.outputs.version_exists == 'false'
        id: provenance_transfer
        env:
          PROVENANCE_FILE: ${{ steps.provenance.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          provenance_dir="transfer/provenance"
          mkdir "$provenance_dir"
          cp "$PROVENANCE_FILE" "$provenance_dir/npm-provenance.json"
          (
            cd "$provenance_dir"
            sha256sum npm-provenance.json > PROVENANCE_MANIFEST.sha256
            sha256sum --check PROVENANCE_MANIFEST.sha256
          )
          artifact="npm-provenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$(sha256sum \
            "$provenance_dir/PROVENANCE_MANIFEST.sha256" | awk '{print $1}')" \
            >> "$GITHUB_OUTPUT"

      - name: Upload the bootstrap provenance bundle
        if: >-
          needs.build-and-verify.outputs.package_exists == 'false' &&
          needs.build-and-verify.outputs.version_exists == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.provenance_transfer.outputs.artifact }}
          path: transfer/provenance/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  npm-bootstrap:
    name: Bootstrap a brand-new npm package without OIDC authority
    needs:
      - build-and-verify
      - npm-identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions: {}
    steps:
      - name: Confirm npm bootstrap is not required
        if: >-
          needs.build-and-verify.outputs.package_exists == 'true' ||
          needs.build-and-verify.outputs.version_exists == 'true'
        run: echo "the npm package or exact version already exists"

      - name: Download the npm publication candidate
        if: >-
          needs.build-and-verify.outputs.package_exists == 'false' &&
          needs.build-and-verify.outputs.version_exists == 'false'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.build-and-verify.outputs.package_artifact }}
          path: transfer/package

      - name: Download the environment-bound provenance bundle
        if: >-
          needs.build-and-verify.outputs.package_exists == 'false' &&
          needs.build-and-verify.outputs.version_exists == 'false'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.npm-identity.outputs.provenance_artifact }}
          path: transfer/provenance

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: >-
          needs.build-and-verify.outputs.package_exists == 'false' &&
          needs.build-and-verify.outputs.version_exists == 'false'
        with:
          node-version: 22.22.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Publish the first package with the pre-generated provenance
        if: >-
          needs.build-and-verify.outputs.package_exists == 'false' &&
          needs.build-and-verify.outputs.version_exists == 'false'
        env:
          EXPECTED_INTEGRITY: ${{ needs.build-and-verify.outputs.npm_integrity }}
          EXPECTED_PACKAGE_MANIFEST_SHA256: ${{ needs.build-and-verify.outputs.package_manifest_sha256 }}
          EXPECTED_PROVENANCE_MANIFEST_SHA256: ${{ needs.npm-identity.outputs.provenance_manifest_sha256 }}
          EXPECTED_TAG_OBJECT: ${{ needs.build-and-verify.outputs.tag_object }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_TAG: ${{ needs.build-and-verify.outputs.publish_tag }}
          RELEASE_VERSION: ${{ needs.build-and-verify.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          package_manifest="transfer/package/PACKAGE_MANIFEST.sha256"
          provenance_manifest="transfer/provenance/PROVENANCE_MANIFEST.sha256"
          test "$(sha256sum "$package_manifest" | awk '{print $1}')" = \
            "$EXPECTED_PACKAGE_MANIFEST_SHA256"
          test "$(sha256sum "$provenance_manifest" | awk '{print $1}')" = \
            "$EXPECTED_PROVENANCE_MANIFEST_SHA256"
          (cd transfer/package && sha256sum --check PACKAGE_MANIFEST.sha256)
          (cd transfer/provenance && sha256sum --check PROVENANCE_MANIFEST.sha256)
          remote_tag_object="$(git ls-remote --refs \
            "https://github.com/ToseaAI/stripe-entitlements.git" \
            "refs/tags/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')"
          test "$remote_tag_object" = "$EXPECTED_TAG_OBJECT"

          package_name="@tosea/stripe-entitlements"
          package_spec="${package_name}@${RELEASE_VERSION}"
          error_file="$RUNNER_TEMP/npm-bootstrap-recheck.txt"
          if npm --userconfig=/dev/null view "$package_name" name \
            --json >/dev/null 2>"$error_file"; then
            existing_integrity="$(npm --userconfig=/dev/null view \
              "$package_spec" dist.integrity --json | tr -d '"\r\n')"
            if [ "$existing_integrity" != "$EXPECTED_INTEGRITY" ]; then
              echo "npm package appeared without the exact bootstrap artifact" >&2
              exit 1
            fi
            existing_candidate="$(npm --userconfig=/dev/null view "$package_name" \
              "dist-tags.$PUBLISH_TAG" --json | tr -d '"\r\n')"
            test "$existing_candidate" = "$RELEASE_VERSION"
            echo "$package_spec already contains the exact bootstrap artifact"
            exit 0
          fi
          if ! grep -Eq '(^|[[:space:]])E404([[:space:]]|$)|404 Not Found' \
            "$error_file"; then
            echo "could not re-confirm brand-new npm package vacancy" >&2
            sed -n '1,12p' "$error_file" >&2
            exit 1
          fi

          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "brand-new npm package requires the environment NPM_TOKEN secret" >&2
            exit 1
          fi

          npm_root="$RUNNER_TEMP/audited-npm"
          mkdir "$npm_root"
          tar -xzf transfer/package/npm-11.19.1.tgz -C "$npm_root"
          mv "$npm_root/package" "$npm_root/npm"
          npm_cli="$npm_root/npm/bin/npm-cli.js"
          test "$(node "$npm_cli" --version)" = "11.19.1"
          archive="transfer/package/tosea-stripe-entitlements-${RELEASE_VERSION}.tgz"
          node "$npm_cli" publish "$archive" \
            --access public \
            --tag "$PUBLISH_TAG" \
            --provenance-file transfer/provenance/npm-provenance.json \
            --ignore-scripts

  npm-verify:
    name: Verify npm Registry provenance and anonymous consumption
    needs:
      - build-and-verify
      - npm-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Check out the immutable public tag without a token
        env:
          EXPECTED_REPOSITORY: ToseaAI/stripe-entitlements
          EXPECTED_TAG_COMMIT: ${{ needs.build-and-verify.outputs.tag_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${EXPECTED_REPOSITORY}.git"
          git fetch --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git checkout --detach "$EXPECTED_TAG_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_TAG_COMMIT"

      - name: Download the npm publication candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.build-and-verify.outputs.package_artifact }}
          path: transfer/package

      - name: Verify the npm candidate transfer manifest
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build-and-verify.outputs.package_manifest_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="transfer/package/PACKAGE_MANIFEST.sha256"
          test "$(sha256sum "$manifest" | awk '{print $1}')" = \
            "$EXPECTED_MANIFEST_SHA256"
          (cd transfer/package && sha256sum --check PACKAGE_MANIFEST.sha256)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          package-manager-cache: false

      - name: Install only the verifier dependencies and exact npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global transfer/package/npm-11.19.1.tgz \
            --ignore-scripts --no-audit --no-fund
          hash -r
          test "$(npm --version)" = "11.19.1"
          npm ci --prefix typescript --ignore-scripts --no-audit --no-fund

      - name: Verify the anonymous npm registry installation
        env:
          BUILD_RUN_ATTEMPT: ${{ needs.build-and-verify.outputs.build_attempt }}
          EXPECTED_INTEGRITY: ${{ needs.build-and-verify.outputs.npm_integrity }}
          EXPECTED_REPOSITORY: ToseaAI/stripe-entitlements
          EXPECTED_REPOSITORY_ID: "1346854294"
          EXPECTED_REPOSITORY_OWNER_ID: "251731194"
          EXPECTED_TAG_COMMIT: ${{ needs.build-and-verify.outputs.tag_commit }}
          NPM_CONFIG_USERCONFIG: /dev/null
          PUBLISH_TAG: ${{ needs.build-and-verify.outputs.publish_tag }}
          RELEASE_VERSION: ${{ needs.build-and-verify.outputs.release_version }}
          VERSION_EXISTED_AT_BUILD: ${{ needs.build-and-verify.outputs.version_exists }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="@tosea/stripe-entitlements"
          package_spec="${package_name}@${RELEASE_VERSION}"
          observed_integrity=""
          for _ in $(seq 1 30); do
            if observed_integrity="$(npm view "$package_spec" dist.integrity \
              --json 2>/dev/null | tr -d '"\r\n')" && \
              [ "$observed_integrity" = "$EXPECTED_INTEGRITY" ]; then
              break
            fi
            sleep 2
          done
          test "$observed_integrity" = "$EXPECTED_INTEGRITY"
          provenance_type="$(npm view "$package_spec" \
            dist.attestations.provenance.predicateType --json | tr -d '"\r\n')"
          test "$provenance_type" = "https://slsa.dev/provenance/v1"
          attestation_url="$(npm view "$package_spec" \
            dist.attestations.url --json | tr -d '"\r\n')"
          expected_attestation_url="https://registry.npmjs.org/-/npm/v1/attestations/@tosea%2fstripe-entitlements@${RELEASE_VERSION}"
          test "$attestation_url" = "$expected_attestation_url"
          attestation_file="$RUNNER_TEMP/npm-attestations.json"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            "$attestation_url" --output "$attestation_file"
          observed_dist_tag="$(npm view "$package_name" \
            "dist-tags.$PUBLISH_TAG" --json | tr -d '"\r\n')"
          test "$observed_dist_tag" = "$RELEASE_VERSION"

          install_root="$(mktemp -d)"
          anonymous_cache="$(mktemp -d)"
          npm --cache="$anonymous_cache" --prefer-online \
            install --prefix "$install_root" --ignore-scripts --no-audit --no-fund \
            "$package_spec"
          npm --cache="$anonymous_cache" audit signatures --prefix "$install_root"
          attempt_policy=exact
          if [ "$VERSION_EXISTED_AT_BUILD" = "true" ] || \
            [ "$BUILD_RUN_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            attempt_policy=same-run-not-newer
          fi
          node typescript/scripts/verify-npm-attestation.mjs \
            --attestations "$attestation_file" \
            --package-name "$package_name" \
            --version "$RELEASE_VERSION" \
            --integrity "$EXPECTED_INTEGRITY" \
            --commit "$EXPECTED_TAG_COMMIT" \
            --tag "$GITHUB_REF_NAME" \
            --repository "$EXPECTED_REPOSITORY" \
            --repository-id "$EXPECTED_REPOSITORY_ID" \
            --repository-owner-id "$EXPECTED_REPOSITORY_OWNER_ID" \
            --workflow-path ".github/workflows/release.yml" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --environment "npm-publish" \
            --attempt-policy "$attempt_policy"
          installed="$install_root/node_modules/$package_name"
          test "$(node -p "require('$installed/package.json').version")" = \
            "$RELEASE_VERSION"
          test "$("$install_root/node_modules/.bin/stripe-entitlements" --version)" = \
            "stripe-entitlements $RELEASE_VERSION"
          (
            cd "$install_root"
            node --input-type=module <<'JS'
          import { CreditAmount, PlanCatalog } from "@tosea/stripe-entitlements";
          import { createBillingFetchHandler } from "@tosea/stripe-entitlements/http";
          import { createNextBillingRouteHandler } from "@tosea/stripe-entitlements/next";
          import { parseNodeBillingCommand } from "@tosea/stripe-entitlements/node";

          if (CreditAmount.parse("0.125").atoms !== 125_000n) {
            throw new Error("registry fractional credit import failed");
          }
          if (typeof PlanCatalog.fromToml !== "function") {
            throw new Error("registry catalog export is unavailable");
          }
          if (typeof createBillingFetchHandler !== "function") {
            throw new Error("registry HTTP export is unavailable");
          }
          if (typeof createNextBillingRouteHandler !== "function") {
            throw new Error("registry Next.js export is unavailable");
          }
          if (typeof parseNodeBillingCommand !== "function") {
            throw new Error("registry Node export is unavailable");
          }
          JS
          )

          registry_pack_root="$(mktemp -d)"
          registry_archive_name="$(npm pack "$package_spec" \
            --pack-destination "$registry_pack_root" \
            --ignore-scripts --silent)"
          test "$registry_archive_name" = \
            "tosea-stripe-entitlements-${RELEASE_VERSION}.tgz"
          registry_archive="$registry_pack_root/$registry_archive_name"
          registry_integrity="sha512-$(openssl dgst -sha512 -binary \
            "$registry_archive" | openssl base64 -A)"
          test "$registry_integrity" = "$EXPECTED_INTEGRITY"
          scripts/verify_npm_next_consumer.sh "$registry_archive"

  container-publish:
    name: Publish and anonymously verify the exact OCI candidate
    needs:
      - build-and-verify
      - npm-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Download the exact tested container archive
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.build-and-verify.outputs.container_artifact }}
          path: transfer/container

      - name: Verify the container transfer manifest
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build-and-verify.outputs.container_manifest_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="transfer/container/CONTAINER_MANIFEST.sha256"
          test "$(sha256sum "$manifest" | awk '{print $1}')" = \
            "$EXPECTED_MANIFEST_SHA256"
          (cd transfer/container && sha256sum --check CONTAINER_MANIFEST.sha256)

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Revalidate the annotated publication tag
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.build-and-verify.outputs.tag_object }}
        shell: bash
        run: |
          set -euo pipefail
          remote_tag_object="$(git ls-remote --refs \
            "https://github.com/ToseaAI/stripe-entitlements.git" \
            "refs/tags/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')"
          test "$remote_tag_object" = "$EXPECTED_TAG_OBJECT"

      - name: Require the repository-named GHCR package to be public
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/ghcr-package.json"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/ToseaAI/packages/container/stripe-entitlements" \
            --output "$metadata"
          python - "$metadata" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              package = json.load(source)
          if package.get("name") != "stripe-entitlements":
              raise SystemExit("GHCR package identity drifted")
          if package.get("package_type") != "container":
              raise SystemExit("GHCR package type drifted")
          if package.get("visibility") != "public":
              raise SystemExit("GHCR package must be public before release")
          PY

      - name: Log in to GHCR with package-only authority
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish or resume immutable OCI tags
        id: push
        env:
          CONTAINER_IMAGE: ${{ needs.build-and-verify.outputs.container_image }}
          RELEASE_VERSION: ${{ needs.build-and-verify.outputs.release_version }}
          TAG_COMMIT: ${{ needs.build-and-verify.outputs.tag_commit }}
        shell: bash
        run: |
          set -euo pipefail
          docker load --input transfer/container/CONTAINER_IMAGE.tar
          release_tag="${CONTAINER_IMAGE}:${RELEASE_VERSION}"
          test "$(docker image inspect "$release_tag" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = \
            "$RELEASE_VERSION"
          test "$(docker image inspect "$release_tag" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = \
            "$TAG_COMMIT"
          test "$(docker image inspect "$release_tag" \
            --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
          anonymous_config=""
          cleanup_publish() {
            if [ -n "$anonymous_config" ]; then
              rm -rf -- "$anonymous_config"
            fi
          }
          trap cleanup_publish EXIT
          candidate_image_id="$(docker image inspect "$release_tag" --format '{{.Id}}')"
          case "$candidate_image_id" in sha256:*) ;; *) exit 1 ;; esac
          immutable_tags_file="$RUNNER_TEMP/immutable-container-tags.txt"
          printf '%s\n' "$release_tag" \
            "${CONTAINER_IMAGE}:sha-${TAG_COMMIT}" > "$immutable_tags_file"

          inspect_remote_digest() {
            local tag="$1"
            local error_file="$RUNNER_TEMP/immutable-container-inspect.txt"
            local output observed error_text
            if output="$(docker buildx imagetools inspect "$tag" 2>"$error_file")"; then
              observed="$(awk '/^Digest:/ {print $2; exit}' <<< "$output")"
              case "$observed" in
                sha256:*) printf '%s\n' "$observed"; return 0 ;;
                *) echo "remote OCI tag returned no canonical digest: $tag" >&2; return 2 ;;
              esac
            fi
            error_text="$(tr '[:upper:]' '[:lower:]' < "$error_file")"
            case "$error_text" in
              *"manifest unknown"*|*"no such manifest"*|*"name unknown"*|*"not found"*)
                return 1
                ;;
              *)
                echo "could not inspect immutable OCI tag $tag" >&2
                sed -n '1,8p' "$error_file" >&2
                return 2
                ;;
            esac
          }

          # A registry digest does not exist until an image has been pushed. On a retry,
          # accept only one already-published digest shared by every immutable name.
          # Its config digest must equal the tested local image ID before a missing name
          # is filled in. This proves the same runnable image without a second registry.
          candidate_digest=""
          while IFS= read -r tag; do
            test -n "$tag"
            if existing_digest="$(inspect_remote_digest "$tag")"; then
              if [ -n "$candidate_digest" ] \
                && [ "$existing_digest" != "$candidate_digest" ]; then
                echo "immutable OCI tags disagree: $tag" >&2
                exit 1
              fi
              candidate_digest="$existing_digest"
            else
              inspect_status="$?"
              if [ "$inspect_status" -ne 1 ]; then
                exit "$inspect_status"
              fi
            fi
          done < "$immutable_tags_file"

          if [ -z "$candidate_digest" ]; then
            docker push "$release_tag"
            for _ in $(seq 1 10); do
              if candidate_digest="$(inspect_remote_digest "$release_tag")"; then
                break
              else
                inspect_status="$?"
                if [ "$inspect_status" -ne 1 ]; then
                  exit "$inspect_status"
                fi
                candidate_digest=""
              fi
              sleep 2
            done
          fi
          case "$candidate_digest" in sha256:*) ;; *) exit 1 ;; esac

          manifest_body="$RUNNER_TEMP/remote-candidate-manifest.json"
          docker buildx imagetools inspect --raw \
            "${CONTAINER_IMAGE}@${candidate_digest}" > "$manifest_body"
          python - "$manifest_body" "$candidate_image_id" <<'PY'
          import json
          import sys

          path, expected_config_digest = sys.argv[1:]
          with open(path, encoding="utf-8") as source:
              manifest = json.load(source)
          if manifest.get("schemaVersion") != 2 or "manifests" in manifest:
              raise SystemExit("release candidate must be one image manifest, not an index")
          if manifest.get("mediaType") not in {
              "application/vnd.docker.distribution.manifest.v2+json",
              "application/vnd.oci.image.manifest.v1+json",
          }:
              raise SystemExit("release candidate has an unsupported manifest type")
          config = manifest.get("config")
          layers = manifest.get("layers")
          if not isinstance(config, dict) or config.get("digest") != expected_config_digest:
              raise SystemExit("published candidate differs from the tested image")
          if not isinstance(layers, list) or not layers:
              raise SystemExit("release candidate has no layers")
          PY

          # Registry-side copying keeps both immutable names on the exact published
          # manifest digest and safely completes a partial prior run.
          while IFS= read -r tag; do
            test -n "$tag"
            if observed_digest="$(inspect_remote_digest "$tag")"; then
              if [ "$observed_digest" != "$candidate_digest" ]; then
                echo "refusing immutable OCI tag with a different digest: $tag" >&2
                exit 1
              fi
              echo "$tag already identifies the exact immutable candidate"
            else
              inspect_status="$?"
              if [ "$inspect_status" -ne 1 ]; then
                exit "$inspect_status"
              fi
              docker buildx imagetools create --prefer-index=false \
                --tag "$tag" "${CONTAINER_IMAGE}@${candidate_digest}"
            fi
          done < "$immutable_tags_file"

          while IFS= read -r tag; do
            observed_digest=""
            for _ in $(seq 1 10); do
              if output="$(docker buildx imagetools inspect "$tag")"; then
                observed_digest="$(awk '/^Digest:/ {print $2; exit}' <<< "$output")"
              else
                observed_digest=""
              fi
              [ "$observed_digest" = "$candidate_digest" ] && break
              sleep 2
            done
            test "$observed_digest" = "$candidate_digest"
          done < "$immutable_tags_file"

          anonymous_config="$(mktemp -d)"
          chmod 700 "$anonymous_config"
          printf '{"auths":{}}\n' > "$anonymous_config/config.json"
          while IFS= read -r tag; do
            observed_digest=""
            for _ in $(seq 1 10); do
              if output="$(DOCKER_CONFIG="$anonymous_config" \
                docker buildx imagetools inspect "$tag")"; then
                observed_digest="$(awk '/^Digest:/ {print $2; exit}' <<< "$output")"
              else
                observed_digest=""
              fi
              [ "$observed_digest" = "$candidate_digest" ] && break
              sleep 2
            done
            test "$observed_digest" = "$candidate_digest"
          done < "$immutable_tags_file"
          docker --config "$anonymous_config" pull \
            "${CONTAINER_IMAGE}@${candidate_digest}"
          docker image inspect "${CONTAINER_IMAGE}@${candidate_digest}" >/dev/null
          echo "digest=$candidate_digest" >> "$GITHUB_OUTPUT"

  container-attest:
    name: Attest the published OCI digest
    needs:
      - build-and-verify
      - container-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      id-token: write
      packages: write
    steps:
      - name: Attest the published container provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.build-and-verify.outputs.container_image }}
          subject-digest: ${{ needs.container-publish.outputs.digest }}
          push-to-registry: true

  finalize-release:
    name: Promote verified channels and publish the GitHub Release
    needs:
      - build-and-verify
      - npm-verify
      - container-publish
      - container-attest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download the public Release candidates
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.build-and-verify.outputs.release_artifact }}
          path: transfer/release

      - name: Download the exact npm CLI candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.build-and-verify.outputs.package_artifact }}
          path: transfer/package

      - name: Verify final transfer manifests
        env:
          EXPECTED_PACKAGE_MANIFEST_SHA256: ${{ needs.build-and-verify.outputs.package_manifest_sha256 }}
          EXPECTED_RELEASE_MANIFEST_SHA256: ${{ needs.build-and-verify.outputs.release_manifest_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          package_manifest="transfer/package/PACKAGE_MANIFEST.sha256"
          release_manifest="transfer/release/RELEASE_MANIFEST.sha256"
          test "$(sha256sum "$package_manifest" | awk '{print $1}')" = \
            "$EXPECTED_PACKAGE_MANIFEST_SHA256"
          test "$(sha256sum "$release_manifest" | awk '{print $1}')" = \
            "$EXPECTED_RELEASE_MANIFEST_SHA256"
          (cd transfer/package && sha256sum --check PACKAGE_MANIFEST.sha256)
          (cd transfer/release && sha256sum --check RELEASE_MANIFEST.sha256)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Prepare the exact audited npm CLI
        id: npm_cli
        shell: bash
        run: |
          set -euo pipefail
          npm_root="$RUNNER_TEMP/audited-npm"
          mkdir "$npm_root"
          tar -xzf transfer/package/npm-11.19.1.tgz -C "$npm_root"
          mv "$npm_root/package" "$npm_root/npm"
          npm_cli="$npm_root/npm/bin/npm-cli.js"
          test "$(node "$npm_cli" --version)" = "11.19.1"
          echo "cli=$npm_cli" >> "$GITHUB_OUTPUT"

      - name: Revalidate the tag and reserve or resume this run's Release
        id: release_checkpoint
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.build-and-verify.outputs.tag_object }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote_tag_object="$(git ls-remote --refs \
            "https://github.com/ToseaAI/stripe-entitlements.git" \
            "refs/tags/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')"
          test "$remote_tag_object" = "$EXPECTED_TAG_OBJECT"
          marker="<!-- release-run:${GITHUB_RUN_ID} tag-object:${EXPECTED_TAG_OBJECT} -->"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            release_json="$RUNNER_TEMP/existing-release.json"
            gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,body \
              > "$release_json"
            already_public="$(python - \
              "$release_json" "$GITHUB_REF_NAME" "$marker" <<'PY'
          import json
          import sys

          path, tag, marker = sys.argv[1:]
          with open(path, encoding="utf-8") as source:
              release = json.load(source)
          if release.get("tagName") != tag:
              raise SystemExit("GitHub Release tag drifted")
          if marker not in release.get("body", ""):
              raise SystemExit("refusing a Release not reserved by this workflow run")
          print("true" if not release.get("isDraft") else "false")
          PY
            )"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --notes "$marker"
            already_public=false
          fi
          echo "already_public=$already_public" >> "$GITHUB_OUTPUT"

      - name: Upload or byte-verify every GitHub Release asset
        env:
          CONTAINER_DIGEST: ${{ needs.container-publish.outputs.digest }}
          CONTAINER_IMAGE: ${{ needs.build-and-verify.outputs.container_image }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build-and-verify.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="transfer/release"
          (cd "$release_dir" && sha256sum --check SHA256SUMS)
          printf '%s@%s\n' "$CONTAINER_IMAGE" "$CONTAINER_DIGEST" \
            > "$release_dir/CONTAINER_DIGEST.txt"
          release_assets=(
            "$release_dir/stripe_entitlements_fastapi-${RELEASE_VERSION}-py3-none-any.whl"
            "$release_dir/stripe_entitlements_fastapi-${RELEASE_VERSION}.tar.gz"
            "$release_dir/tosea-stripe-entitlements-${RELEASE_VERSION}.tgz"
            "$release_dir/SHA256SUMS"
            "$release_dir/CONTAINER_DIGEST.txt"
            "$release_dir/CONTAINER_SBOM.spdx.json"
          )
          existing_assets="$(gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[].name')"
          for asset in "${release_assets[@]}"; do
            test -s "$asset"
            name="${asset##*/}"
            if grep -Fx "$name" <<< "$existing_assets" >/dev/null; then
              download_dir="$(mktemp -d)"
              gh release download "$GITHUB_REF_NAME" \
                --pattern "$name" --dir "$download_dir"
              cmp "$asset" "$download_dir/$name"
              rm -rf -- "$download_dir"
            else
              gh release upload "$GITHUB_REF_NAME" "$asset"
            fi
          done

          expected_assets="$(printf '%s\n' "${release_assets[@]##*/}" | sort)"
          observed_assets=""
          for _ in $(seq 1 10); do
            observed_assets="$(gh release view "$GITHUB_REF_NAME" --json assets \
              --jq '.assets[].name' | sort)"
            [ "$observed_assets" = "$expected_assets" ] && break
            sleep 2
          done
          test "$observed_assets" = "$expected_assets"
          verification_dir="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" --dir "$verification_dir"
          for asset in "${release_assets[@]}"; do
            cmp "$asset" "$verification_dir/${asset##*/}"
          done
          rm -rf -- "$verification_dir"

      - name: Revalidate every remote candidate before channel promotion
        env:
          CONTAINER_DIGEST: ${{ needs.container-publish.outputs.digest }}
          CONTAINER_IMAGE: ${{ needs.build-and-verify.outputs.container_image }}
          EXPECTED_NPM_INTEGRITY: ${{ needs.build-and-verify.outputs.npm_integrity }}
          NPM_CONFIG_USERCONFIG: /dev/null
          PUBLISH_TAG: ${{ needs.build-and-verify.outputs.publish_tag }}
          RELEASE_VERSION: ${{ needs.build-and-verify.outputs.release_version }}
          TAG_COMMIT: ${{ needs.build-and-verify.outputs.tag_commit }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="@tosea/stripe-entitlements"
          package_spec="${package_name}@${RELEASE_VERSION}"
          observed_integrity="$(npm view "$package_spec" dist.integrity \
            --json | tr -d '"\r\n')"
          test "$observed_integrity" = "$EXPECTED_NPM_INTEGRITY"
          observed_candidate="$(npm view "$package_name" \
            "dist-tags.$PUBLISH_TAG" --json | tr -d '"\r\n')"
          test "$observed_candidate" = "$RELEASE_VERSION"
          observed_provenance_type="$(npm view "$package_spec" \
            dist.attestations.provenance.predicateType --json | tr -d '"\r\n')"
          test "$observed_provenance_type" = "https://slsa.dev/provenance/v1"

          tags_file="$RUNNER_TEMP/expected-container-tags.txt"
          printf '%s\n' "${CONTAINER_IMAGE}:${RELEASE_VERSION}" \
            "${CONTAINER_IMAGE}:sha-${TAG_COMMIT}" > "$tags_file"
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf -- "$anonymous_config"' EXIT
          chmod 700 "$anonymous_config"
          printf '{"auths":{}}\n' > "$anonymous_config/config.json"
          while IFS= read -r tag; do
            observed_digest="$(DOCKER_CONFIG="$anonymous_config" \
              docker buildx imagetools inspect "$tag" \
              | awk '/^Digest:/ {print $2; exit}')"
            test "$observed_digest" = "$CONTAINER_DIGEST"
          done < "$tags_file"

      - name: Determine moving-channel release policy
        id: channel_policy
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
          RELEASE_VERSION: ${{ needs.build-and-verify.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          # The workflow-wide concurrency group serializes every channel writer. Public
          # stable Git tags are the release history; npm latest is an additional
          # cross-registry no-rollback check. GHCR channels are copied only below from
          # the attested immutable digest and are verified after the copy.
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          current_text = os.environ["RELEASE_VERSION"]
          stable = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", current_text)
          if stable is None:
              raise SystemExit("moving channels require a stable release version")
          current = tuple(map(int, stable.groups()))
          remote = subprocess.check_output(
              [
                  "git",
                  "ls-remote",
                  "--refs",
                  "--tags",
                  "https://github.com/ToseaAI/stripe-entitlements.git",
                  "refs/tags/v*.*.*",
              ],
              text=True,
          ).splitlines()
          released = []
          for line in remote:
              fields = line.split()
              match = re.fullmatch(
                  r"refs/tags/v(\d+)\.(\d+)\.(\d+)",
                  fields[1] if len(fields) == 2 else "",
              )
              if match:
                  released.append(tuple(map(int, match.groups())))
          newest = current >= max(released, default=current)
          newest_minor = current[2] >= max(
              (
                  version[2]
                  for version in released
                  if version[:2] == current[:2]
              ),
              default=current[2],
          )

          npm_tags_text = subprocess.check_output(
              ["npm", "view", "@tosea/stripe-entitlements", "dist-tags", "--json"],
              text=True,
          )
          npm_tags = json.loads(npm_tags_text)
          if not isinstance(npm_tags, dict):
              raise SystemExit("npm dist-tags response is not an object")
          npm_latest_text = npm_tags.get("latest")
          if npm_latest_text is not None:
              npm_latest_match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", npm_latest_text)
              if npm_latest_match is None:
                  raise SystemExit("existing npm latest is not a stable version")
              npm_latest = tuple(map(int, npm_latest_match.groups()))
              newest = newest and current >= npm_latest

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"latest={'true' if newest else 'false'}\n")
              output.write(f"minor={'true' if newest_minor else 'false'}\n")
          PY

      - name: Log in to GHCR for verified channel promotion
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Promote and anonymously verify eligible OCI channels
        env:
          CONTAINER_DIGEST: ${{ needs.container-publish.outputs.digest }}
          CONTAINER_IMAGE: ${{ needs.build-and-verify.outputs.container_image }}
          IS_LATEST: ${{ steps.channel_policy.outputs.latest }}
          IS_MINOR: ${{ steps.channel_policy.outputs.minor }}
          RELEASE_VERSION: ${{ needs.build-and-verify.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          moving_tags_file="$RUNNER_TEMP/moving-container-tags.txt"
          : > "$moving_tags_file"
          if [ "$IS_MINOR" = "true" ]; then
            printf '%s:%s\n' "$CONTAINER_IMAGE" "${RELEASE_VERSION%.*}" \
              >> "$moving_tags_file"
          fi
          if [ "$IS_LATEST" = "true" ]; then
            printf '%s:latest\n' "$CONTAINER_IMAGE" >> "$moving_tags_file"
          fi
          sort -u -o "$moving_tags_file" "$moving_tags_file"

          while IFS= read -r tag; do
            test -n "$tag"
            docker buildx imagetools create --prefer-index=false \
              --tag "$tag" "${CONTAINER_IMAGE}@${CONTAINER_DIGEST}"
          done < "$moving_tags_file"

          anonymous_config="$(mktemp -d)"
          trap 'rm -rf -- "$anonymous_config"' EXIT
          chmod 700 "$anonymous_config"
          printf '{"auths":{}}\n' > "$anonymous_config/config.json"
          while IFS= read -r tag; do
            test -n "$tag"
            observed_digest=""
            for _ in $(seq 1 10); do
              if output="$(DOCKER_CONFIG="$anonymous_config" \
                docker buildx imagetools inspect "$tag")"; then
                observed_digest="$(awk '/^Digest:/ {print $2; exit}' <<< "$output")"
              else
                observed_digest=""
              fi
              [ "$observed_digest" = "$CONTAINER_DIGEST" ] && break
              sleep 2
            done
            test "$observed_digest" = "$CONTAINER_DIGEST"
          done < "$moving_tags_file"

      - name: Remove GHCR credentials before npm authority
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io
          docker_config="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          if [ -f "$docker_config" ]; then
            python - "$docker_config" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              config = json.load(source)
          auths = config.get("auths", {})
          if not isinstance(auths, dict) or any(
              "ghcr.io" in host.casefold() for host in auths
          ):
              raise SystemExit("GHCR credential remains after logout")
          PY
          fi

      - name: Promote the verified npm candidate to latest
        if: steps.channel_policy.outputs.latest == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CLI: ${{ steps.npm_cli.outputs.cli }}
          RELEASE_VERSION: ${{ needs.build-and-verify.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="@tosea/stripe-entitlements"
          package_spec="${package_name}@${RELEASE_VERSION}"
          registry_latest="$(node "$NPM_CLI" --userconfig=/dev/null \
            view "$package_name" dist-tags.latest --json 2>/dev/null | \
            tr -d '"\r\n')"
          if [ "$registry_latest" = "$RELEASE_VERSION" ]; then
            echo "npm latest already identifies the verified release"
            exit 0
          fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "npm latest promotion requires the environment NPM_TOKEN secret" >&2
            exit 1
          fi
          python - "$RELEASE_VERSION" "$registry_latest" <<'PY'
          import re
          import sys

          current_text, latest_text = sys.argv[1:]
          stable = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")
          current_match = stable.fullmatch(current_text)
          latest_match = stable.fullmatch(latest_text) if latest_text else None
          if current_match is None:
              raise SystemExit("npm latest promotion requires a stable version")
          if latest_text and latest_match is None:
              raise SystemExit("existing npm latest is not a stable version")
          current = tuple(map(int, current_match.groups()))
          latest = tuple(map(int, latest_match.groups())) if latest_match else None
          if latest is not None and current < latest:
              raise SystemExit(
                  f"refusing to move npm latest backward from {latest_text} to {current_text}"
              )
          PY
          node "$NPM_CLI" dist-tag add "$package_spec" latest --ignore-scripts
          observed_latest="$(node "$NPM_CLI" --userconfig=/dev/null \
            view "$package_name" dist-tags.latest --json | tr -d '"\r\n')"
          test "$observed_latest" = "$RELEASE_VERSION"

      - name: Publish the fully verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_LATEST: ${{ steps.channel_policy.outputs.latest }}
          NPM_CONFIG_USERCONFIG: /dev/null
          RELEASE_VERSION: ${{ needs.build-and-verify.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$IS_LATEST" = "true" ]; then
            observed_latest="$(npm view "@tosea/stripe-entitlements" \
              dist-tags.latest --json | tr -d '"\r\n')"
            test "$observed_latest" = "$RELEASE_VERSION"
          fi
          is_draft="$(gh release view "$GITHUB_REF_NAME" \
            --json isDraft --jq .isDraft)"
          if [ "$is_draft" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            test "${{ steps.release_checkpoint.outputs.already_public }}" = "true"
          fi
          test "$(gh release view "$GITHUB_REF_NAME" \
            --json isDraft --jq .isDraft)" = "false"
