name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run python scripts/check_release_versions.py
          uv run ruff format --check .
          uv run ruff check .
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
          uv run python -m compileall -q src scripts
      - name: Type check
        run: uv run mypy src
      - name: PostgreSQL and race tests
        run: uv run pytest -m "not real_stripe"
      - name: Audit Python dependencies
        run: uv audit
      - name: Build and inspect distributions
        run: |
          scripts/build_distributions.sh dist
          uv run python scripts/verify_python_distributions.py dist
          uv run python - <<'PY'
          import glob
          import tarfile
          import zipfile
          from pathlib import Path

          wheel = glob.glob("dist/*.whl")
          assert len(wheel) == 1, wheel
          with zipfile.ZipFile(wheel[0]) as archive:
              names = set(archive.namelist())
          source_package_files = {
              path.relative_to("src").as_posix()
              for path in Path("src/stripe_entitlements").rglob("*")
              if path.is_file() and "__pycache__" not in path.parts
          }
          missing_source_package_files = source_package_files - names
          assert not missing_source_package_files, sorted(missing_source_package_files)
          required = {
              "stripe_entitlements/entitlements.py",
              "stripe_entitlements/internal_api.py",
              "stripe_entitlements/py.typed",
              "stripe_entitlements/plans.toml",
              "stripe_entitlements/migrations/001_v3_baseline.sql",
              "stripe_entitlements/migrations/002_stripe_request_snapshots.sql",
          }
          missing = required - names
          assert not missing, sorted(missing)
          packaged_migrations = {
              name for name in names if name.startswith("stripe_entitlements/migrations/")
          }
          assert packaged_migrations == {
              "stripe_entitlements/migrations/001_v3_baseline.sql",
              "stripe_entitlements/migrations/002_stripe_request_snapshots.sql",
          }, sorted(packaged_migrations)

          sdist = glob.glob("dist/*.tar.gz")
          assert len(sdist) == 1, sdist
          with tarfile.open(sdist[0], "r:gz") as archive:
              sdist_names = set(archive.getnames())
          roots = {Path(name).parts[0] for name in sdist_names if Path(name).parts}
          assert len(roots) == 1, sorted(roots)
          root = roots.pop()
          normalized_sdist_names = {
              name.removeprefix(f"{root}/") for name in sdist_names if name != root
          }
          required_sdist = {
              ".dockerignore",
              ".env.example",
              ".github/RELEASE_CHECKLIST.md",
              ".github/workflows/ci.yml",
              ".github/workflows/release.yml",
              ".gitignore",
              "Dockerfile",
              "docker-compose.yml",
              "uv.lock",
              "plans.toml",
              "migrations/001_v3_baseline.sql",
              "migrations/002_stripe_request_snapshots.sql",
              "scripts/bootstrap_stripe.py",
              "scripts/build_distributions.sh",
              "scripts/check_release_versions.py",
              "scripts/verify_python_distributions.py",
              "typescript/.env.example",
              "typescript/package.json",
              "typescript/package-lock.json",
              "typescript/src/index.ts",
              "typescript/tsconfig.build.json",
              "examples/auth_starters/README.md",
              "examples/job_outbox/demo.py",
              "tests/test_job_outbox_example.py",
              "web/.env.example",
              "web/package.json",
              "web/package-lock.json",
              "vercel.json",
              "vercel.typescript.json",
              "vercel_app.py",
          }
          missing_sdist = required_sdist - normalized_sdist_names
          assert not missing_sdist, sorted(missing_sdist)
          forbidden_sdist_prefixes = (
              "web/.next/",
              "web/node_modules/",
              "web/playwright-report/",
              "web/test-results/",
              "typescript/coverage/",
              "typescript/dist/",
              "typescript/node_modules/",
          )
          leaked_generated_files = sorted(
              name
              for name in normalized_sdist_names
              if name.startswith(forbidden_sdist_prefixes)
          )
          assert not leaked_generated_files, leaked_generated_files[:20]
          packaged_sdist_migrations = {
              name for name in normalized_sdist_names if name.startswith("migrations/")
          }
          assert packaged_sdist_migrations == {
              "migrations/001_v3_baseline.sql",
              "migrations/002_stripe_request_snapshots.sql",
          }, sorted(packaged_sdist_migrations)
          PY

          wheel="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          test_root="$(mktemp -d)"
          uv venv "$test_root/venv"
          uv pip install --python "$test_root/venv/bin/python" "$wheel"
          (
            cd "$test_root"
            "$test_root/venv/bin/python" - "$GITHUB_WORKSPACE/pyproject.toml" <<'PY'
          import subprocess
          import sys
          import tomllib
          from importlib.metadata import version
          from pathlib import Path

          from stripe_entitlements import __version__
          from stripe_entitlements.catalog import PlanCatalog
          from stripe_entitlements.resources import (
              default_migration_directory,
              default_plan_catalog_path,
          )

          catalog_path = Path(default_plan_catalog_path())
          migration_dir = default_migration_directory()
          assert catalog_path.is_file(), catalog_path
          assert [path.name for path in sorted(migration_dir.glob("*.sql"))] == [
              "001_v3_baseline.sql",
              "002_stripe_request_snapshots.sql",
          ]
          assert [plan.key for plan in PlanCatalog.from_toml(catalog_path).ordered()] == [
              "starter",
              "pro",
              "ultra",
          ]
          expected = tomllib.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["project"][
              "version"
          ]
          assert version("stripe-entitlements-fastapi") == expected
          assert __version__ == expected
          cli = Path(sys.executable).with_name("stripe-entitlements")
          completed = subprocess.run(
              [str(cli), "--version"],
              check=True,
              capture_output=True,
              text=True,
          )
          assert completed.stderr == "", completed.stderr
          assert completed.stdout.strip() == f"stripe-entitlements {expected}"
          PY
          )

          wheel_pg_container="stripe-wheel-pg-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}"
          cleanup_wheel_pg() {
            docker rm -f "$wheel_pg_container" >/dev/null 2>&1 || true
          }
          trap cleanup_wheel_pg EXIT
          cleanup_wheel_pg
          docker run -d \
            --name "$wheel_pg_container" \
            --tmpfs /var/lib/postgresql/data:rw,nosuid,nodev,size=256m \
            -e POSTGRES_PASSWORD=wheel-ci-only \
            -e POSTGRES_DB=wheel_ci \
            -p 127.0.0.1::5432 \
            postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          for attempt in $(seq 1 60); do
            if docker exec "$wheel_pg_container" \
              pg_isready -U postgres -d wheel_ci >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$wheel_pg_container"
              exit 1
            fi
            sleep 1
          done
          wheel_pg_port="$(docker port "$wheel_pg_container" 5432/tcp | sed 's/.*://')"
          DATABASE_URL="postgresql://postgres:wheel-ci-only@127.0.0.1:${wheel_pg_port}/wheel_ci" \
            "$test_root/venv/bin/stripe-entitlements" migrate
          applied_migrations="$(docker exec "$wheel_pg_container" \
            psql -U postgres -d wheel_ci -Atqc \
            "select string_agg(filename, ',' order by filename) from schema_migrations")"
          test "$applied_migrations" = \
            "001_v3_baseline.sql,002_stripe_request_snapshots.sql"
          canonical_migration_history="$(sha256sum \
            migrations/001_v3_baseline.sql \
            migrations/002_stripe_request_snapshots.sql | \
            awk '{sub("^migrations/", "", $2); print $2 "|" $1}')"
          applied_migration_history="$(docker exec "$wheel_pg_container" \
            psql -U postgres -d wheel_ci -Atqc \
            "select filename||'|'||sha256 from schema_migrations order by filename")"
          test "$applied_migration_history" = "$canonical_migration_history"
          wheel_schema_contract="$(docker exec "$wheel_pg_container" \
            psql -U postgres -d wheel_ci -Atqc \
            "select
               not exists (
                 select 1 from information_schema.columns
                  where table_schema='public' and table_name='stripe_webhook_events'
                    and column_name='payload_sha256'
               ),
               position('ON DELETE RESTRICT' in pg_get_constraintdef(oid)) > 0,
               (select column_default='clock_timestamp()'
                  from information_schema.columns
                 where table_schema='public' and table_name='billing_incidents'
                   and column_name='last_seen_at'),
               (select data_type='text' and is_nullable='YES'
                  from information_schema.columns
                 where table_schema='public' and table_name='credit_pack_orders'
                   and column_name='request_customer_id'),
               (select count(*)=6
                  from information_schema.columns
                 where table_schema='public'
                   and table_name in (
                     'checkout_claims','credit_pack_orders','billing_plan_changes'
                   )
                   and column_name in (
                     'request_snapshot_version','stripe_request_snapshot'
                   )),
               to_regclass('billing_incidents_unresolved_account_kind_seen') is not null,
               to_regclass('billing_plan_changes_one_pending') is not null
             from pg_constraint
            where conrelid='stripe_invoice_state'::regclass
              and conname='stripe_invoice_state_account_id_fkey'")"
          test "$wheel_schema_contract" = "t|t|t|t|t|t|t"
          cleanup_wheel_pg
          trap - EXIT
      - name: Check whitespace
        run: git diff --check

  typescript:
    name: TypeScript billing core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install locked Python and TypeScript dependencies
        run: |
          cd ..
          uv sync --frozen
          cd typescript
          npm ci
      - name: Audit dependencies
        run: |
          npm audit --omit=dev
          npm audit
      - name: Lint, type check, PostgreSQL races, and build
        run: npm run check
      - name: Inspect, install, and migrate with the npm artifact
        run: |
          set -euo pipefail
          expected_version="$(node -p "require('./package.json').version")"
          archive_name="$(npm pack --pack-destination "$RUNNER_TEMP" --silent)"
          test "$archive_name" = \
            "tosea-stripe-entitlements-${expected_version}.tgz"
          archive="$RUNNER_TEMP/$archive_name"
          test -s "$archive"
          package_root="$(mktemp -d)"
          npm install --prefix "$package_root" "$archive"
          installed="$package_root/node_modules/@tosea/stripe-entitlements"
          test -x "$package_root/node_modules/.bin/stripe-entitlements"
          test -f "$installed/.env.example"
          test "$(node -p "require('$installed/package.json').version")" = \
            "$expected_version"
          cmp ../LICENSE "$installed/LICENSE"
          cmp ../NOTICE "$installed/NOTICE"
          cmp ../plans.toml "$installed/dist/plans.toml"
          packaged_migrations="$(find "$installed/dist/migrations" -maxdepth 1 \
            -type f -name '*.sql' -printf '%f\n' | sort)"
          test "$packaged_migrations" = \
            $'001_v3_baseline.sql\n002_stripe_request_snapshots.sql'
          cmp ../migrations/001_v3_baseline.sql \
            "$installed/dist/migrations/001_v3_baseline.sql"
          cmp ../migrations/002_stripe_request_snapshots.sql \
            "$installed/dist/migrations/002_stripe_request_snapshots.sql"
          test "$("$package_root/node_modules/.bin/stripe-entitlements" --version)" = \
            "stripe-entitlements $expected_version"
          (
            cd "$package_root"
            node --input-type=module <<'JS'
          import {
            CREDIT_SCALE,
            CreditAmount,
            PlanCatalog,
          } from "@tosea/stripe-entitlements";
          import { createBillingFetchHandler } from "@tosea/stripe-entitlements/http";
          import {
            createNextBillingRouteHandler,
            runtime,
          } from "@tosea/stripe-entitlements/next";
          import { parseNodeBillingCommand } from "@tosea/stripe-entitlements/node";

          if (CREDIT_SCALE !== 1_000_000n) throw new Error("credit scale drift");
          if (CreditAmount.parse("0.125").atoms !== 125_000n) {
            throw new Error("fractional credit import failed");
          }
          if (typeof PlanCatalog.fromToml !== "function") {
            throw new Error("catalog package export is unavailable");
          }
          if (typeof createBillingFetchHandler !== "function") {
            throw new Error("HTTP package export is unavailable");
          }
          if (typeof createNextBillingRouteHandler !== "function" || runtime !== "nodejs") {
            throw new Error("Next.js package export is unavailable");
          }
          if (typeof parseNodeBillingCommand !== "function") {
            throw new Error("Node package export is unavailable");
          }
          JS
          )
          ../scripts/verify_npm_migration_smoke.sh "$archive" "$expected_version"

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build hardened image
        run: docker build --tag stripe-entitlements-ci .
      - name: Verify migrations and non-root read-only runtime
        run: |
          set -euo pipefail
          test "$(docker image inspect stripe-entitlements-ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect stripe-entitlements-ci --format '{{json .Config.Healthcheck.Test}}')" != "null"
          python3 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          expected = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"][
              "version"
          ]
          completed = subprocess.run(
              [
                  "docker",
                  "run",
                  "--rm",
                  "stripe-entitlements-ci",
                  "stripe-entitlements",
                  "--version",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          assert completed.stderr == "", completed.stderr
          assert completed.stdout.strip() == f"stripe-entitlements {expected}"
          PY
          runtime_suffix="${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}"
          runtime_network="stripe-entitlements-ci-${runtime_suffix}"
          runtime_pg="stripe-entitlements-pg-${runtime_suffix}"
          runtime_app="stripe-entitlements-app-${runtime_suffix}"
          cleanup_runtime() {
            docker rm -f "$runtime_app" "$runtime_pg" >/dev/null 2>&1 || true
            docker network rm "$runtime_network" >/dev/null 2>&1 || true
          }
          trap cleanup_runtime EXIT
          cleanup_runtime
          docker network create --internal "$runtime_network"
          docker run -d \
            --name "$runtime_pg" \
            --network "$runtime_network" \
            --tmpfs /var/lib/postgresql/data:rw,nosuid,nodev,size=256m \
            -e POSTGRES_PASSWORD=container-ci-only \
            -e POSTGRES_DB=container_ci \
            postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          for attempt in $(seq 1 60); do
            if docker exec "$runtime_pg" \
              pg_isready -U postgres -d container_ci >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$runtime_pg"
              exit 1
            fi
            sleep 1
          done

          runtime_database_url="postgresql://postgres:container-ci-only@${runtime_pg}:5432/container_ci"
          docker run --rm \
            --network "$runtime_network" \
            --user 10001:10001 \
            -e DATABASE_URL="$runtime_database_url" \
            stripe-entitlements-ci stripe-entitlements migrate
          applied_migrations="$(docker exec "$runtime_pg" \
            psql -U postgres -d container_ci -Atqc \
            "select string_agg(filename, ',' order by filename) from schema_migrations")"
          test "$applied_migrations" = \
            "001_v3_baseline.sql,002_stripe_request_snapshots.sql"
          canonical_migration_history="$(sha256sum \
            migrations/001_v3_baseline.sql \
            migrations/002_stripe_request_snapshots.sql | \
            awk '{sub("^migrations/", "", $2); print $2 "|" $1}')"
          applied_migration_history="$(docker exec "$runtime_pg" \
            psql -U postgres -d container_ci -Atqc \
            "select filename||'|'||sha256 from schema_migrations order by filename")"
          test "$applied_migration_history" = "$canonical_migration_history"
          container_schema_contract="$(docker exec "$runtime_pg" \
            psql -U postgres -d container_ci -Atqc \
            "select
               not exists (
                 select 1 from information_schema.columns
                  where table_schema='public' and table_name='stripe_webhook_events'
                    and column_name='payload_sha256'
               ),
               position('ON DELETE RESTRICT' in pg_get_constraintdef(oid)) > 0,
               (select column_default='clock_timestamp()'
                  from information_schema.columns
                 where table_schema='public' and table_name='billing_incidents'
                   and column_name='last_seen_at'),
               (select data_type='text' and is_nullable='YES'
                  from information_schema.columns
                 where table_schema='public' and table_name='credit_pack_orders'
                   and column_name='request_customer_id'),
               (select count(*)=6
                  from information_schema.columns
                 where table_schema='public'
                   and table_name in (
                     'checkout_claims','credit_pack_orders','billing_plan_changes'
                   )
                   and column_name in (
                     'request_snapshot_version','stripe_request_snapshot'
                   )),
               to_regclass('billing_incidents_unresolved_account_kind_seen') is not null,
               to_regclass('billing_plan_changes_one_pending') is not null
             from pg_constraint
            where conrelid='stripe_invoice_state'::regclass
              and conname='stripe_invoice_state_account_id_fkey'")"
          test "$container_schema_contract" = "t|t|t|t|t|t|t"

          docker run -d \
            --name "$runtime_app" \
            --network "$runtime_network" \
            --user 10001:10001 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e DATABASE_URL="$runtime_database_url" \
            -e STRIPE_SECRET_KEY=sk_test_ci_placeholder \
            -e STRIPE_WEBHOOK_SECRET=whsec_ci_placeholder \
            -e STRIPE_WEBHOOK_API_VERSION=2026-06-24.dahlia \
            stripe-entitlements-ci
          runtime_ip="$(docker inspect "$runtime_app" \
            --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')"
          test -n "$runtime_ip"
          health_json=""
          for attempt in $(seq 1 60); do
            if health_json="$(curl --noproxy '*' --fail --silent --show-error \
              "http://${runtime_ip}:8000/health" 2>/dev/null)"; then
              break
            fi
            if [ "$(docker inspect "$runtime_app" --format '{{.State.Running}}')" != "true" ]; then
              docker logs "$runtime_app"
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$runtime_app"
              exit 1
            fi
            sleep 1
          done
          python3 -c \
            'import json,sys; value=json.loads(sys.argv[1]); assert value["ok"] is True and value["database"] is True, value' \
            "$health_json"

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: |
          npm audit --omit=dev
          npm audit
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Component tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_ALLOW_INDEXING: "true"
          NEXT_PUBLIC_SITE_URL: https://billing.example.test
