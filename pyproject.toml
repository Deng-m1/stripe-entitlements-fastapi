[project]
name = "stripe-entitlements-fastapi"
version = "0.4.0"
description = "Race-safe Stripe billing, SaaS entitlements, fractional credits, and credit packs for FastAPI"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Tosea" }]
keywords = [
  "stripe",
  "fastapi",
  "postgresql",
  "billing",
  "subscriptions",
  "webhooks",
  "idempotency",
  "saas",
  "entitlements",
  "stripe-webhooks",
  "stripe-proration",
  "stripe-checkout",
  "stripe-subscriptions",
  "credit-ledger",
  "credit-packs",
  "fractional-credits",
  "saas-starter",
  "fastapi-stripe",
  "vercel",
  "nextjs",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "asyncpg>=0.30.0,<1",
  "fastapi>=0.115.0,<1",
  "pydantic-settings>=2.7.0,<3",
  "stripe>=15.0.0,<16",
  "uvicorn[standard]>=0.34.0,<1",
]

[project.optional-dependencies]
auth = [
  "PyJWT[crypto]>=2.10.1,<3",
]

[dependency-groups]
dev = [
  "PyJWT[crypto]>=2.10.1,<3",
  "httpx>=0.28.0,<1",
  "mypy>=1.15.0,<3",
  "pytest>=8.3.0,<10",
  "pytest-asyncio>=0.25.0,<2",
  "ruff>=0.11.0,<1",
]

[project.urls]
Homepage = "https://github.com/Deng-m1/stripe-entitlements-fastapi"
Repository = "https://github.com/Deng-m1/stripe-entitlements-fastapi"
Issues = "https://github.com/Deng-m1/stripe-entitlements-fastapi/issues"
Documentation = "https://github.com/Deng-m1/stripe-entitlements-fastapi#readme"
Changelog = "https://github.com/Deng-m1/stripe-entitlements-fastapi/blob/main/CHANGELOG.md"

[project.scripts]
stripe-entitlements = "stripe_entitlements.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stripe_entitlements"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "stripe_entitlements/migrations"
"plans.toml" = "stripe_entitlements/plans.toml"

[tool.hatch.build.targets.sdist]
include = [
  "/.dockerignore",
  "/.env.example",
  "/.github",
  "/.gitignore",
  "/src/stripe_entitlements",
  "/migrations",
  "/plans.toml",
  "/pyproject.toml",
  "/uv.lock",
  "/README.md",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/docs",
  "/examples",
  "/scripts",
  "/tests",
  "/typescript",
  "/web",
  "/Dockerfile",
  "/docker-compose.yml",
  "/LICENSE",
  "/NOTICE",
  "/vercel.json",
  "/vercel.simulation.json",
  "/vercel.typescript.json",
  "/vercel_app.py",
]
exclude = [
  "/typescript/coverage",
  "/typescript/dist",
  "/typescript/node_modules",
  "/web/.next",
  "/web/node_modules",
  "/web/playwright-report",
  "/web/test-results",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --tb=short"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "real_stripe: calls the real Stripe test-mode API and requires STRIPE_SECRET_KEY",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["stripe_entitlements"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "stripe", "stripe.*"]
ignore_missing_imports = true
