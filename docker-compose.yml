services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: stripe_entitlements
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stripe_entitlements"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - stripe_entitlements_pg:/var/lib/postgresql/data

volumes:
  stripe_entitlements_pg:
